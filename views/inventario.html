<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Farmacia - PetExperts</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <!-- Iconos de Lucide -->
    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL QUE UNE EL SIDEBAR Y EL CONTENIDO -->
    <div class="layout-container">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar" data-active="inventario"></aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <header class="content-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>INVENTARIO DE FARMACIA</h1>
                    <p style="color: var(--text-muted); font-size: 0.875rem;">Control de stock, medicamentos e insumos médicos</p>
                </div>
                <button class="btn-primary" onclick="abrirModalProducto()">
                    <i data-lucide="plus"></i> Ingresar Producto
                </button>
            </header>

            <!-- Buscador y Filtros alineados en fila -->
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                <div class="input-group" style="flex: 1; min-width: 240px; position: relative;">
                    <i data-lucide="search" style="position: absolute; left: 0.875rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 18px; height: 18px;"></i>
                    <input type="text" id="buscarProducto" class="form-control" placeholder="Buscar medicamento o insumo..." style="padding-left: 2.75rem;" onkeyup="filtrarInventario()">
                </div>

                <div style="width: 220px;">
                    <select id="filtroCategoria" class="form-control" onchange="filtrarInventario()">
                        <option value="">Todas las Categorías</option>
                        <option value="Antibióticos">Antibióticos</option>
                        <option value="Antiparasitarios">Antiparasitarios</option>
                        <option value="Analgésicos">Analgésicos</option>
                        <option value="Insumos Médicos">Insumos Médicos</option>
                        <option value="Vacunas">Vacunas</option>
                    </select>
                </div>
            </div>

            <section class="data-table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>CÓDIGO</th>
                            <th>PRODUCTO</th>
                            <th>CATEGORÍA</th>
                            <th>STOCK</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tablaInventarioBody">
                        <!-- Carga dinámica vía JS -->
                    </tbody>
                </table>
            </section>
        </main>

    </div> <!-- FIN DEL LAYOUT-CONTAINER -->

    <!-- MODAL INGRESAR PRODUCTO -->
    <div id="modalProducto" class="modal-overlay">
        <div class="modal-container" style="background: white; padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px;">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="font-size: 1.125rem; font-weight: 600;">Ingresar Nuevo Producto</h3>
                <button onclick="cerrarModalProducto()" style="background: none; border: none; cursor: pointer; color: var(--text-muted);"><i data-lucide="x"></i></button>
            </div>
            <form id="formProducto" onsubmit="guardarProducto(event)" class="modal-body">
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Código de Producto</label>
                        <input type="text" id="codigoProd" required class="form-control" placeholder="Ej: MED-106">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Categoría</label>
                        <select id="categoriaProd" class="form-control" required>
                            <option value="Antibióticos">Antibióticos</option>
                            <option value="Antiparasitarios">Antiparasitarios</option>
                            <option value="Analgésicos">Analgésicos</option>
                            <option value="Insumos Médicos">Insumos Médicos</option>
                            <option value="Vacunas">Vacunas</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Nombre del Producto / Medicamento</label>
                    <input type="text" id="nombreProd" required class="form-control" placeholder="Ej: Amoxicilina 250mg Suspension">
                </div>

                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                    <div class="form-group" style="flex: 1;">
                        <label>Stock Inicial</label>
                        <input type="number" id="stockProd" min="0" required class="form-control" placeholder="Ej: 45">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Precio Unitario (S/)</label>
                        <input type="number" step="0.10" id="precioProd" required class="form-control" placeholder="Ej: 35.00">
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <button type="button" onclick="cerrarModalProducto()" style="padding: 0.625rem 1rem; border: 1px solid var(--border-color); background: white; border-radius: 0.5rem; cursor: pointer;">Cancelar</button>
                    <button type="submit" class="btn-primary" style="padding: 0.625rem 1rem; background: var(--brand-teal); color: white; border: none; border-radius: 0.5rem; cursor: pointer;">Guardar Producto</button>
                </div>
            </form>
        </div>
    </div>

    
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/inventario.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
