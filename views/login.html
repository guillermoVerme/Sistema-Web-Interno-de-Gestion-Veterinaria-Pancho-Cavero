<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - PetExperts</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-main, #f8fafc);
            padding: 1.5rem;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color, #e2e8f0);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div style="display: flex; justify-content: center; align-items: center; gap: 0.5rem;">
                    <i data-lucide="heart-pulse" style="width: 32px; height: 32px; color: var(--primary);"></i>
                    <span style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">PetExperts</span>
                </div>
                <h2>Iniciar Sesión</h2>
                <p style="font-size: 0.875rem; color: var(--text-muted, #64748b);">Acceso al sistema de gestión veterinaria</p>
            </div>

            <!-- FORMULARIO DE LOGIN -->
            <form onsubmit="procesarLogin(event)" class="login-form">
                <div class="form-group">
                    <label for="correoLogin">Correo Electrónico</label>
                    <input type="email" id="correoLogin" class="form-control" placeholder="correo@petexperts.com" required>
                </div>

                <div class="form-group">
                    <label for="passLogin">Contraseña</label>
                    <input type="password" id="passLogin" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; height: 44px;">
                    Ingresar
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL OBLIGATORIO: CAMBIO DE CONTRASEÑA EN PRIMER INGRESO -->
    <div id="modalCambioPassword" class="modal-overlay">
        <div class="modal-content">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div style="width: 48px; height: 48px; background: #e0e7ff; color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem auto;">
                    <i data-lucide="key-round" style="width: 24px; height: 24px;"></i>
                </div>
                <h3 style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary);">Primer Inicio de Sesión</h3>
                <p style="font-size: 0.875rem; color: var(--text-muted, #64748b); margin-top: 0.25rem;">Por seguridad de tu cuenta, debes definir una nueva contraseña antes de continuar.</p>
            </div>

            <form onsubmit="procesarCambioObligatorio(event)">
                <input type="hidden" id="dniUsuarioCambio">

                <div class="form-group">
                    <label for="nuevaPass">Nueva Contraseña</label>
                    <input type="password" id="nuevaPass" class="form-control" placeholder="Mínimo 6 caracteres" minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirmarPass">Confirmar Nueva Contraseña</label>
                    <input type="password" id="confirmarPass" class="form-control" placeholder="Repite la nueva contraseña" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; height: 44px; margin-top: 1rem;">
                    Actualizar Contraseña y Entrar
                </button>
            </form>
        </div>
    </div>

    <script src="../assets/js/login.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
