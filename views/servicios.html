<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Servicios - PetExperts</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <!-- Iconos de Lucide -->
    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
</head>
<body>

    <!-- CONTENEDOR PRINCIPAL QUE UNE EL SIDEBAR Y EL CONTENIDO -->
    <div class="layout-container">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar" data-active="servicios"></aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
            <header class="content-header" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>GESTIÓN DE SERVICIOS</h1>
                    <p style="color: var(--text-muted); font-size: 0.875rem;">Administra el catálogo de servicios y tarifas veterinarias</p>
                </div>
                <button class="btn-primary" onclick="abrirModalServicio()">
                    <i data-lucide="plus"></i> Nuevo Servicio
                </button>
            </header>

            <section class="data-table-container" style="margin-top: 1.5rem;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>CÓDIGO</th>
                            <th>NOMBRE DEL SERVICIO</th>
                            <th>CATEGORÍA</th>
                            <th>PRECIO</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tablaServiciosBody">
                        <!-- Filas renderizadas por JavaScript -->
                    </tbody>
                </table>
            </section>
        </main>

    </div> <!-- FIN DEL LAYOUT-CONTAINER -->

    <!-- MODAL EMERGENTE INTERACTIVO -->
    <div id="modalServicio" class="modal-overlay">
        <div class="modal-container" style="background: white; padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px;">
            <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="font-size: 1.125rem; font-weight: 600;">Registrar Servicio</h3>
                <button onclick="cerrarModalServicio()" style="background: none; border: none; cursor: pointer; color: var(--text-muted);"><i data-lucide="x"></i></button>
            </div>
            <form id="formServicio" onsubmit="guardarServicio(event)" class="modal-body">
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Nombre del Servicio</label>
                    <input type="text" id="nombreServicio" required class="form-control" placeholder="Ej: Consulta Especializada">
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label>Categoría</label>
                    <select id="categoriaServicio" class="form-control">
                        <option>Consultas</option>
                        <option>Vacunación</option>
                        <option>Cirugía</option>
                        <option>Estética</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Precio (S/)</label>
                    <input type="number" step="0.01" id="precioServicio" required class="form-control" placeholder="00.00">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <button type="button" onclick="cerrarModalServicio()" style="padding: 0.625rem 1rem; border: 1px solid var(--border-color); background: white; border-radius: 0.5rem; cursor: pointer;">Cancelar</button>
                    <button type="submit" class="btn-primary" style="padding: 0.625rem 1rem; background: var(--brand-teal); color: white; border: none; border-radius: 0.5rem; cursor: pointer;">Guardar Servicio</button>
                </div>
            </form>
        </div>
    </div>

    
    <script src="../assets/js/core.js"></script>
    <script src="../assets/js/servicios.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>
</html>
